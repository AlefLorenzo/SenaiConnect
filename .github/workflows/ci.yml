name: SENAI Connect CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: senai-connect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and syntax validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Validate syntax in every backend JavaScript file
        working-directory: backend
        run: |
          find . -type d -name node_modules -prune -o -type f -name '*.js' -print0 |
            xargs -0 -r -n1 node --check
      - name: Run backend tests
        working-directory: backend
        run: npm test -- --runInBand

  frontend:
    name: Frontend lint, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend ESLint
        working-directory: frontend
        run: npm run lint
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand
      - name: Build frontend
        working-directory: frontend
        run: npm run build
